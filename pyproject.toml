[project]
name = "conformity-cli"
version = "0.1.0"
description = "Check that a directory conforms to the standards of a source directory."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Omar Ashkar" }]
keywords = ["conformity", "directory", "cli", "tui", "lint"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "rich>=13.7",
    "textual>=0.80",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/OmarAshkar/conformity"
Repository = "https://github.com/OmarAshkar/conformity"
Issues = "https://github.com/OmarAshkar/conformity/issues"

[project.scripts]
conformity = "conformity.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conformity"]

[tool.hatch.build.targets.sdist]
exclude = ["/recipe", "/dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
