# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.1.0"

package:
  name: conformity-cli
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/conformity-cli/conformity_cli-${{ version }}.tar.gz
  sha256: 464e6b2d43ef203f7c93fbda678ba95dd5c91563b0ffef678abac0b405dbc120

build:
  number: 0
  noarch: python
  python:
    entry_points:
      - conformity = conformity.cli:app
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - hatchling
    - pip
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }}
    - rich >=13.7
    - textual >=0.80
    - typer >=0.12

tests:
  - python:
      imports:
        - conformity
      pip_check: true
      python_version:
        - ${{ python_min }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - conformity --help

about:
  homepage: https://github.com/OmarAshkar/conformity
  summary: Check that a directory conforms to the standards of a source directory.
  license: GPL-3.0-or-later
  license_file: LICENSE
  repository: https://github.com/OmarAshkar/conformity
  documentation: https://github.com/OmarAshkar/conformity#readme

extra:
  recipe-maintainers:
    - OmarAshkar
