# Example rules file. Pass it with: conformity TARGET SOURCE --config rules.toml

[files]
# Must exist at the same path with identical SHA-256.
identical = [
    "LICENSE",
    "pyproject.toml",
    ".github/workflows/**/*.yml",
]

# Must exist at the same path, but SHA-256 must differ.
different = [
    ".env",
    "config/local.toml",
]

# Must match at least one file. Glob patterns need at least one match, and a
# directory followed by an asterisk matches every file inside it.
match = [
    "src/*.py",
]

[directories]
# Must match at least one directory. Literal paths must exist.
match = ["src", "tests", "docs", "packages/*"]
