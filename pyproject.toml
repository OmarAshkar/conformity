[project]
name = "conformity"
version = "0.1.0"
description = "Check that a directory conforms to the standards of a source directory."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "rich>=13.7",
    "textual>=0.80",
    "typer>=0.12",
]

[project.scripts]
conformity = "conformity.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conformity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
