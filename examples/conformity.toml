# Example rules file. Pass it with: conformity TARGET SOURCE --config rules.toml

[files]
# Must exist at the same path with identical SHA-256.
identical = [
    "LICENSE",
    "pyproject.toml",
    ".github/workflows/**/*.yml",
]

# Must exist at the same path, but SHA-256 must differ.
different = [
    ".env",
    "config/local.toml",
]

# Files required in the target. Glob patterns need at least one match.
required = [
    "src/*.py",
]

[directories]
# Must exist in the target. A glob needs at least one matching directory.
required = ["src", "tests", "docs", "packages/*"]

[directories.structure]
# Minimal entries that must exist inside each directory. Glob entries need
# at least one match.
src = ["__init__.py", "*.py"]
tests = ["conftest.py"]
